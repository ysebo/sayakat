services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sayakat-db
    environment:
      POSTGRES_DB: sayakat
      POSTGRES_USER: sayakat
      POSTGRES_PASSWORD: sayakat
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sayakat -d sayakat"]
      interval: 5s
      timeout: 3s
      retries: 10

  osrm:
    image: osrm/osrm-backend:v5.27.1
    container_name: sayakat-osrm
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/kyrgyzstan-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./infra/osrm/data:/data
    profiles: ["osrm"]

volumes:
  db-data:
